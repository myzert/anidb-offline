name: Anime metadata sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: AniList dump mode
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
          - index_only

permissions:
  contents: write

concurrency:
  group: anime-metadata-sync
  cancel-in-progress: false

jobs:
  dump-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Update AniList data
        if: github.event_name == 'schedule'
        run: python scripts/dump_anilist.py --mode incremental --hours 26

      - name: Update AniList data (manual)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/dump_anilist.py --mode "${{ inputs.mode }}"

      - name: Sync ReAnime IDs, episodes, and thumbnails
        id: reanime
        continue-on-error: true
        run: python scripts/dump_reanime.py

      - name: Report ReAnime sync status
        if: steps.reanime.outcome == 'failure'
        run: |
          echo "::warning::ReAnime sync was blocked or unavailable. The AniList dump will still be committed; retry ReAnime sync when its API is reachable."
          echo "⚠️ ReAnime sync failed or was blocked; AniList data sync continues. Re-run this workflow later to retry." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: sync anime metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
