name: Anime metadata sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: AniList dump mode
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - full
          - index_only

permissions:
  contents: write

concurrency:
  group: anime-metadata-sync
  cancel-in-progress: false

jobs:
  dump-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Update AniList data
        if: github.event_name == 'schedule'
        run: python scripts/dump_anilist.py --mode incremental --hours 26
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB: ${{ secrets.TMDB }}

      - name: Update AniList data (manual)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/dump_anilist.py --mode "${{ inputs.mode }}"
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB: ${{ secrets.TMDB }}

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/releases/
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: sync anime metadata and database releases"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f data/releases/manifest.json ]; then
            TAG_NAME=$(python -c "import json; print(json.load(open('data/releases/manifest.json'))['latest_release'])")
            gh release create "${TAG_NAME}" data/releases/Anidb_*.{csv,xlsx,tar.gz,zip} \
              --title "AniDB Offline Database Release (${TAG_NAME})" \
              --notes "Automated 24h AniDB Offline database release in CSV, XLSX, TAR.GZ, and ZIP formats (UTC+7)." || true
          fi
