name: Hourly AniList Data Dump

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      mode:
        description: 'Dump mode (incremental or full)'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

jobs:
  dump_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
        
    - name: Run dump script (Incremental Hourly)
      if: github.event_name == 'schedule'
      run: python scripts/dump_anilist.py --mode incremental --hours 2
      
    - name: Run dump script (Manual Dispatch)
      if: github.event_name == 'workflow_dispatch'
      run: python scripts/dump_anilist.py --mode ${{ github.event.inputs.mode }}
      
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/
        
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update AniList data dump [skip ci]"
          git pull origin main --rebase
          git push
        fi
